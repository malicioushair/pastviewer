import java.util.Properties

buildscript {
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        //noinspection AndroidGradlePluginVersion
        classpath 'com.android.tools.build:gradle:9.2.1'
    }
}

repositories {
    google()
    mavenCentral()
}

apply plugin: qtGradlePluginType

// Load local PostHog configuration without committing it to source control.
def posthogProperties = new Properties()
def posthogEnvFile = rootProject.file('.env')
if (posthogEnvFile.exists()) {
    posthogEnvFile.withInputStream { posthogProperties.load(it) }
}
def posthogProjectToken = System.getenv('POSTHOG_PROJECT_TOKEN') ?: posthogProperties.getProperty('POSTHOG_PROJECT_TOKEN')
def posthogHost = System.getenv('POSTHOG_HOST') ?: posthogProperties.getProperty('POSTHOG_HOST')

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar', '*.aar'])
    //noinspection GradleDependency
    implementation 'androidx.core:core:1.17.0'
    implementation 'com.android.billingclient:billing:9.1.0'
    implementation 'io.sentry:sentry-android:8.0.0'
    implementation 'com.posthog:posthog-android:3.+'
}

android {
    /*******************************************************
     * The following variables:
     * - androidBuildToolsVersion,
     * - androidCompileSdkVersion
     * - qtAndroidDir - holds the path to qt android files
     *                   needed to build any Qt application
     *                   on Android.
     * - qtGradlePluginType - whether to build an app or a library
     *
     * are defined in gradle.properties file. This file is
     * updated by QtCreator and androiddeployqt tools.
     * Changing them manually might break the compilation!
     *******************************************************/

    namespace = androidPackageName
    compileSdkVersion androidCompileSdkVersion
    buildToolsVersion androidBuildToolsVersion
    ndkVersion = androidNdkVersion

    buildFeatures {
        buildConfig = true
    }

    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java.srcDirs = [qtAndroidDir + '/src', 'src', 'java']
            kotlin.srcDirs = [qtAndroidDir + '/src', 'src', 'kotlin']
            aidl.srcDirs = [qtAndroidDir + '/src', 'src', 'aidl']
            res.srcDirs = [qtAndroidDir + '/res', 'res']
            resources.srcDirs = ['resources']
            renderscript.srcDirs = ['src']
            assets.srcDirs = ['assets']
            jniLibs.srcDirs = ['libs']
       }
    }

    tasks.withType(JavaCompile) {
        options.incremental = true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError = false
    }

    androidResources {
        noCompress.add('rcc')
        localeFilters.add('en')
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging = legacyPackaging.toBoolean()
        }
    }

    defaultConfig {
        minSdkVersion qtMinSdkVersion
        targetSdkVersion qtTargetSdkVersion
        ndk.abiFilters = qtTargetAbiList.split(",")

        buildConfigField 'String', 'POSTHOG_PROJECT_TOKEN', posthogProjectToken ? "\"${posthogProjectToken}\"" : 'null'
        buildConfigField 'String', 'POSTHOG_HOST', posthogHost ? "\"${posthogHost}\"" : 'null'
    }
}
