appId: ${APP_ID}
name: Local draft route, stop, edit and persistence
tags: [regression, drafts, offline]
---
- runFlow: helpers/launch_clean.yaml
- runFlow:
    when:
      platform: Android
    commands:
      - addMedia:
          - fixtures/pastviewer-maestro-cover.png
- evalScript: ${output.draftTitle = 'Maestro-' + Date.now()}
- evalScript: ${output.editedTitle = 'Edit-' + Date.now().toString(36)}
- runFlow:
    file: helpers/open_new_draft_form.yaml
    env:
      DRAFT_TITLE: ${output.draftTitle}
# This screenshot is a run artifact; Android selects the saved fixture below.
- takeScreenshot: draft_before_image_picker
- runFlow:
    when:
      platform: Android
    commands:
      - runFlow: helpers/select_android_cover.yaml
- runFlow: helpers/confirm_draft_form.yaml
- assertVisible:
    text: Remove last point
    enabled: false
- tapOn: Add point
- assertVisible:
    text: Remove last point
    enabled: true
- tapOn: Remove last point
- assertVisible: Delete
- tapOn: Cancel
- assertVisible:
    text: Remove last point
    enabled: true
- tapOn: Remove last point
- tapOn: Delete
- assertVisible:
    text: Remove last point
    enabled: false
- tapOn: Add point
- tapOn: Add stop
- assertVisible: Add tour stop
- assertVisible: Add images
- assertVisible: Upload Images
- assertVisible: Add audio
- scrollUntilVisible:
    element: Upload Audio
    direction: DOWN
    timeout: 10000
- assertVisible: Upload Audio
- scrollUntilVisible:
    element: Cancel
    direction: DOWN
    timeout: 10000
- tapOn: Cancel
- assertVisible: Add point
- tapOn: Finish
- assertVisible: Drafts
- scrollUntilVisible:
    element: ${output.draftTitle}
    direction: DOWN
    timeout: 10000
- assertVisible: ${output.draftTitle}
- tapOn: ${output.draftTitle}
- assertVisible: Edit draft
- runFlow:
    file: helpers/focus_title.yaml
    env:
      NEW_TITLE: ${output.editedTitle}
- scrollUntilVisible:
    element: Save
    direction: DOWN
    timeout: 10000
- tapOn: Save
- assertVisible: Drafts
- scrollUntilVisible:
    element: ${output.editedTitle}
    direction: DOWN
    timeout: 10000
- assertVisible: ${output.editedTitle}
- assertNotVisible: ${output.draftTitle}
- runFlow: helpers/launch_clean.yaml
- runFlow: helpers/open_drafts.yaml
- scrollUntilVisible:
    element: ${output.editedTitle}
    direction: DOWN
    timeout: 10000
- assertVisible: ${output.editedTitle}
- tapOn: ${output.editedTitle}
- tapOn: Save and edit route / stops
- assertVisible: Add point
- assertVisible:
    text: Remove last point
    enabled: true
- tapOn: Finish
- assertVisible: Edit draft
- tapOn: Cancel
- assertVisible: Drafts
# Leave this test draft in place: the list does not expose a unique selector
# linking a specific Delete button to its draft row.
- runFlow: helpers/restore_admin.yaml
