appId: ${APP_ID}
tags: [helper]
---
# Preserve drafts and preferences. Dismiss only known first-launch overlays.
- runFlow: dismiss_android_picker.yaml
- launchApp:
    clearState: false
    stopApp: true
    permissions:
      all: allow
- extendedWaitUntil:
    visible: Compass|Got it|Skip
    timeout: 20000
- runFlow: dismiss_overlays.yaml
- runFlow: assert_map.yaml
