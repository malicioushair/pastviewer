appId: ${APP_ID}
name: open gallery tour
tags: [helper]
---
- runFlow: launch_clean.yaml
- runFlow:
    file: open_tour_info.yaml
    env:
      CATALOG_TOUR: ${GALLERY_TOUR}
- assertVisible: Start tour
- tapOn: Start tour
- runFlow: dismiss_overlays.yaml
- assertVisible: Exit Tour
- assertVisible: "I'm here"
- tapOn: "I'm here"
- runFlow: dismiss_overlays.yaml
- assertVisible: Stop Details
