appId: ${APP_ID}
tags: [helper]
---
# CATALOG_TOUR is a known catalog fixture supplied by the parent flow.
- runFlow: open_available_tours.yaml
- scrollUntilVisible:
    element: ${CATALOG_TOUR}
    direction: DOWN
    timeout: 15000
- tapOn: ${CATALOG_TOUR}
- extendedWaitUntil:
    visible: Tour Info
    timeout: 10000
- runFlow: dismiss_overlays.yaml
- assertVisible: Tour Info
